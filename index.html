<html lang="en">
<head>

  <link rel="canonical" href="https://bowo-prasetyo.github.io/quantum-lab/#/lab/2" />

  <!--
    The 2-qubit simulator is now part of Quantum Lab, which covers 1, 2 and
    3 qubits in one app. This page sends visitors to the matching place:
      #/manual (or #/manual/...)  →  the lessons
      anything else               →  the 2-qubit lab

    first visit.
  -->
  <script>
    (function () {
      var lab = 'https://bowo-prasetyo.github.io/quantum-lab/';
      var target = /^#\/manual/.test(location.hash) ? lab + '#/lessons' : lab + '#/lab/2';
      location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://bowo-prasetyo.github.io/quantum-lab/#/lab/2" />
  </noscript>

</head>

    <p><a href="https://bowo-prasetyo.github.io/quantum-lab/#/lab/2">Open the 2-qubit lab</a> · <a href="https://bowo-prasetyo.github.io/quantum-lab/#/lessons">Start the lessons</a></p>
